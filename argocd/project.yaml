apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sre-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: SRE GitOps Project for the Task Manager

  sourceRepos:
    - https://github.com/YOUR-USERNAME/sre-task-manager

  destinations:
    - namespace: application
      server: https://kubernetes.default.svc

  roles:
    - name: sre-team
      description: Full SRE access
      policies:
        - p, proj:sre-project:sre-team, applications, *, sre-project/*, allow
      groups:
        - sre-admins

  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: CronJob
