apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-task-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    team: sre
spec:
  project: sre-project

  # Helm chart stored in this repository. The CI pipeline bumps image.tag in values.yaml.
  source:
    repoURL: https://github.com/YOUR-USERNAME/sre-task-manager
    targetRevision: main
    path: helm/sre-task-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: application

  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # undo manual changes (drift) automatically
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
