apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-task-manager.name" . }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "sre-task-manager.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "sre-task-manager.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
