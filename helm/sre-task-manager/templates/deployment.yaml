apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sre-task-manager.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "sre-task-manager.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "sre-task-manager.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "sre-task-manager.name" . }}
      annotations:
        # Roll the pods when the configuration changes
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sre-task-manager.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "sre-task-manager.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "sre-task-manager.name" . }}-config
          env:
            # Bind Flask to the pod IP instead of 0.0.0.0
            - name: FLASK_RUN_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Gives the app time to start before liveness checks begin
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 2
            failureThreshold: 30
          # Restart the container if the process stops answering
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Only send traffic to pods that report ready
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
