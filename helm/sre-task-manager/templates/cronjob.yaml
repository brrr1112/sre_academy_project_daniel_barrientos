{{- if .Values.trafficGenerator.enabled }}
# Synthetic traffic: keeps the dashboards alive and exercises every endpoint,
# including one invalid request per run (validation error metric).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: task-caller
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.trafficGenerator.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: curl-container
              image: {{ .Values.trafficGenerator.image }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  BASE=http://{{ include "sre-task-manager.name" . }}-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}
                  JSON='Content-Type: application/json'
                  ID=$(curl -s --max-time 5 -X POST -H "$JSON" -d '{"title":"synthetic check"}' $BASE/api/tasks | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
                  curl -s --max-time 5 -o /dev/null $BASE/api/tasks
                  curl -s --max-time 5 -o /dev/null -X PUT -H "$JSON" -d '{"done":true}' $BASE/api/tasks/$ID
                  curl -s --max-time 5 -o /dev/null -X POST -H "$JSON" -d '{"title":""}' $BASE/api/tasks
                  curl -s --max-time 5 -o /dev/null -X DELETE $BASE/api/tasks/$ID
          restartPolicy: Never
{{- end }}
