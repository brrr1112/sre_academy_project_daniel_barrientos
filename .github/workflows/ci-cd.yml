name: SRE Task Manager Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements-dev.txt

      - name: Code formatting check
        run: |
          cd app
          black --check .

      - name: Linting
        run: |
          cd app
          flake8 . --max-line-length=100

      - name: Run unit tests
        run: |
          cd app
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=90

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Static security analysis (fails on medium/high findings)
        run: |
          cd app
          bandit -r app.py -ll

      - name: Check for known vulnerabilities
        # Informational: `safety check` may require an account, so it does not block the pipeline
        continue-on-error: true
        run: |
          cd app
          safety check -r requirements.txt

  validate-chart:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint and render the chart
        run: |
          helm lint helm/sre-task-manager
          helm template sre-task-manager helm/sre-task-manager --namespace application > /dev/null

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [test, security-scan, validate-chart]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # GitOps: the pipeline never touches the cluster. It writes the new image tag to Git and
  # ArgoCD (auto-sync) rolls it out. Reverting this commit is the rollback.
  update-manifest:
    name: Update image tag in Git (GitOps)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Bump the image tag in the Helm values
        run: |
          sed -i 's|^  tag: ".*"|  tag: "${{ needs.build.outputs.image-tag }}"|' helm/sre-task-manager/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add helm/sre-task-manager/values.yaml
          git commit -m "ci: deploy image ${{ needs.build.outputs.image-tag }} [skip ci]"
          git push
