name: SRE Task Manager Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    name: Run Tests and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd App
          pip install -r requirements-dev.txt

      - name: Linting
        run: |
          cd App
          flake8 . --max-line-length=100

      - name: Run unit tests
        run: |
          cd App
          pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=90

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Static security analysis (fails on medium/high findings)
        run: |
          cd App
          bandit -r app.py -ll

      - name: Check for known vulnerabilities
        # Informational: `safety check` may require an account, so it does not block the pipeline
        continue-on-error: true
        run: |
          cd App
          safety check -r requirements.txt

  validate-chart:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint and render the chart
        run: |
          helm lint helm/sre-task-manager
          helm template sre-task-manager helm/sre-task-manager --namespace application > /dev/null

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [test, security-scan, validate-chart]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      #arm64 image
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One tar per architecture (docker save cannot export a multi-platform image):
      #   sre-task-manager-<tag>-amd64-<ddHHMM>.tar -> x86_64 servers, GitHub runners
      #   sre-task-manager-<tag>-arm64-<ddHHMM>.tar -> Apple Silicon / ARM servers
      - name: Build amd64 and arm64 images and save them to App/dockerImage (timestamp ddHHMM)
        run: |
          TIMESTAMP=$(date -u +%d%H%M)
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p App/dockerImage
          for ARCH in amd64 arm64; do
            docker buildx build --platform "linux/${ARCH}" --load \
              -t "sre-task-manager:${TAG}-${ARCH}" App
            docker save -o "App/dockerImage/sre-task-manager-${TAG}-${ARCH}-${TIMESTAMP}.tar" \
              "sre-task-manager:${TAG}-${ARCH}"
          done
          ls -lh App/dockerImage

      - name: Upload saved images as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.vars.outputs.tag }}
          path: App/dockerImage/*.tar
          retention-days: 14
