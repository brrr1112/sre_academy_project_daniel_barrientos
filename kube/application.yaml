# Identity for the app pods. The app never calls the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-task-manager
  namespace: application
automountServiceAccountToken: false
---
# Non-secret configuration, injected as environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-task-manager-config
  namespace: application
  labels:
    app: sre-task-manager
data:
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
  MAX_TASKS: "200"
  # Enables POST /api/chaos (fault injection) so alerts can be demonstrated on demand
  ENABLE_CHAOS: "true"
  OTEL_SERVICE_NAME: "sre-task-manager"
  OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger.opentelemetry.svc.cluster.local:4317"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-task-manager
  namespace: application
  labels:
    app: sre-task-manager
spec:
  # One replica on purpose: tasks are kept in memory (see app/app.py)
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: sre-task-manager
  template:
    metadata:
      labels:
        app: sre-task-manager
    spec:
      serviceAccountName: sre-task-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sre-task-manager
          # cluster.sh replaces the repository part with $IMAGE_REPO
          image: ghcr.io/YOUR-USERNAME/sre-task-manager:1.0.0
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: sre-task-manager-config
          env:
            # Bind Flask to the pod IP instead of 0.0.0.0
            - name: FLASK_RUN_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Gives the app time to start before liveness checks begin
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 2
            failureThreshold: 30
          # Restart the container if the process stops answering
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Only send traffic to pods that report ready
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: sre-task-manager-service
  namespace: application
  labels:
    app: sre-task-manager
spec:
  type: NodePort
  selector:
    app: sre-task-manager
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007
---
# Synthetic traffic: keeps the dashboards alive and exercises every endpoint,
# including one invalid request per run (validation error metric).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: task-caller
  namespace: application
spec:
  schedule: "*/1 * * * *"  # runs every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: curl-container
              image: curlimages/curl:8.23.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  BASE=http://sre-task-manager-service.application.svc.cluster.local:5000
                  JSON='Content-Type: application/json'
                  ID=$(curl -s --max-time 5 -X POST -H "$JSON" -d '{"title":"synthetic check"}' $BASE/api/tasks | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
                  curl -s --max-time 5 -o /dev/null $BASE/api/tasks
                  curl -s --max-time 5 -o /dev/null -X PUT -H "$JSON" -d '{"done":true}' $BASE/api/tasks/$ID
                  curl -s --max-time 5 -o /dev/null -X POST -H "$JSON" -d '{"title":""}' $BASE/api/tasks
                  curl -s --max-time 5 -o /dev/null -X DELETE $BASE/api/tasks/$ID
          restartPolicy: Never
