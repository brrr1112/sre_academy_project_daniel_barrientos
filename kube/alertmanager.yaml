apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # ---- Email (REPLACE the three values below with your own SMTP account) ----
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'sre-alerts@example.com'
      smtp_auth_username: 'sre-alerts@example.com'
      smtp_require_tls: true
      # Secrets are mounted from the "alertmanager-secrets" Secret (created by cluster.sh)
      smtp_auth_password_file: /etc/alertmanager-secrets/smtp-password
      slack_api_url_file: /etc/alertmanager-secrets/slack-webhook-url

    templates: []

    route:
      # Default: everything goes to Slack
      receiver: slack-warnings
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Critical alerts page people: Slack + email, repeated more often
        - matchers:
            - severity="critical"
          receiver: slack-and-email-critical
          repeat_interval: 1h

    receivers:
      - name: slack-warnings
        slack_configs:
          - channel: '#sre-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}

      - name: slack-and-email-critical
        slack_configs:
          - channel: '#sre-alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] CRITICAL {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
        email_configs:
          - to: 'oncall@example.com'
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] CRITICAL {{ .CommonLabels.alertname }}'

    # When the app is down, silence the follow-up warnings (low traffic, latency, ...)
    inhibit_rules:
      - source_matchers:
          - alertname="TaskManagerDown"
        target_matchers:
          - severity=~"warning|critical"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-deployment
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.35.0
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            # Listen on the pod IP, not on all interfaces
            - "--web.listen-address=$(POD_IP):9093"
            # Single instance: disable the HA gossip listener
            - "--cluster.listen-address="
          ports:
            - containerPort: 9093
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            periodSeconds: 15
          volumeMounts:
            - name: alertmanager-config-volume
              mountPath: /etc/alertmanager
            - name: alertmanager-secrets-volume
              mountPath: /etc/alertmanager-secrets
              readOnly: true
            - name: alertmanager-storage-volume
              mountPath: /alertmanager
      volumes:
        - name: alertmanager-config-volume
          configMap:
            name: alertmanager-config
        - name: alertmanager-secrets-volume
          secret:
            secretName: alertmanager-secrets
        - name: alertmanager-storage-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - protocol: TCP
      port: 9093
      targetPort: 9093
      nodePort: 30093
  type: NodePort
