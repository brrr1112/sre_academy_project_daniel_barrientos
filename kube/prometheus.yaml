apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Alerts that fire are sent to Alertmanager (see alertmanager.yaml)
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      - "/etc/prometheus/rules/*.rules"

    scrape_configs:
      # The task manager pods (discovered through the Kubernetes API)
      - job_name: 'sre-task-manager'
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['application']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: sre-task-manager
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            regex: (.+)
            replacement: ${1}:5000
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name

      # Container CPU / memory (cAdvisor) through the API server proxy.
      # The API server certificate is verified with the cluster CA.
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_node_name]
            target_label: kubernetes_node

      # Prometheus, Alertmanager and Grafana pods (annotation based, like exercise 11)
      - job_name: 'monitoring-stack'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['monitoring']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^;]+);(.+)
            replacement: ${1}:${2}
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app: prometheus
data:
  sre-task-manager.rules: |
    groups:
      - name: sre-task-manager-golden-signals
        rules:
          # ---- Availability ----
          - alert: TaskManagerDown
            expr: absent(up{job="sre-task-manager"} == 1)
            for: 1m
            labels:
              severity: critical
              signal: availability
            annotations:
              summary: "Task manager is down"
              description: "No healthy sre-task-manager target has been scraped for 1 minute."
              runbook: "docs/runbook.md#taskmanagerdown"

          # ---- Errors ----
          - alert: HighErrorRate
            expr: |
              sum(rate(http_requests_total{job="sre-task-manager",status=~"5.."}[5m]))
                /
              sum(rate(http_requests_total{job="sre-task-manager"}[5m])) > 0.05
            for: 2m
            labels:
              severity: critical
              signal: errors
            annotations:
              summary: "More than 5% of requests are failing"
              description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."
              runbook: "docs/runbook.md#higherrorrate"

          # ---- Latency ----
          - alert: HighLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{job="sre-task-manager"}[5m])) by (le)
              ) > 0.5
            for: 2m
            labels:
              severity: warning
              signal: latency
            annotations:
              summary: "p95 latency is above 500 ms"
              description: "p95 latency is {{ $value | humanizeDuration }} over the last 5 minutes."
              runbook: "docs/runbook.md#highlatencyp95"

          # ---- Traffic ----
          # The synthetic CronJob sends ~5 requests/minute (~0.08 req/s), so a rate below
          # 0.02 req/s means traffic (including the synthetic one) stopped.
          - alert: LowTraffic
            expr: sum(rate(http_requests_total{job="sre-task-manager"}[5m])) < 0.02
            for: 5m
            labels:
              severity: warning
              signal: traffic
            annotations:
              summary: "Request rate dropped"
              description: "Only {{ $value | humanize }} requests/second in the last 5 minutes."
              runbook: "docs/runbook.md#lowtraffic"

          # ---- Saturation ----
          - alert: HighMemoryUsage
            expr: |
              container_memory_working_set_bytes{namespace="application",container="sre-task-manager"}
                /
              container_spec_memory_limit_bytes{namespace="application",container="sre-task-manager"} > 0.8
            for: 5m
            labels:
              severity: warning
              signal: saturation
            annotations:
              summary: "Task manager is using more than 80% of its memory limit"
              description: "Memory usage is {{ $value | humanizePercentage }} of the limit."
              runbook: "docs/runbook.md#highmemoryusage"

          - alert: TooManyConcurrentRequests
            expr: max_over_time(http_requests_in_progress{job="sre-task-manager"}[1m]) > 3
            for: 2m
            labels:
              severity: warning
              signal: saturation
            annotations:
              summary: "Requests are piling up"
              description: "Up to {{ $value }} requests were being served at the same time."
              runbook: "docs/runbook.md#toomanyconcurrentrequests"

          # ---- Stability ----
          - alert: TaskManagerRestarted
            expr: changes(process_start_time_seconds{job="sre-task-manager"}[15m]) > 0
            labels:
              severity: warning
              signal: availability
            annotations:
              summary: "Task manager restarted"
              description: "The process restarted in the last 15 minutes (in-memory tasks were lost)."
              runbook: "docs/runbook.md#taskmanagerrestarted"

          # ---- Business ----
          - alert: TooManyOpenTasks
            expr: tasks_current{job="sre-task-manager",status="open"} > 150
            for: 5m
            labels:
              severity: warning
              signal: business
            annotations:
              summary: "Open task backlog is growing"
              description: "{{ $value }} open tasks (limit is 200)."
              runbook: "docs/runbook.md#toomanyopentasks"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.16.0
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - "--config.file=/etc/prometheus/config/prometheus.yml"
            - "--storage.tsdb.path=/prometheus/"
            - "--storage.tsdb.retention.time=10d"
            # Listen on the pod IP, not on all interfaces
            - "--web.listen-address=$(POD_IP):9090"
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 15
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/config
            - name: prometheus-rules-volume
              mountPath: /etc/prometheus/rules
            - name: prometheus-storage-volume
              mountPath: /prometheus/
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-rules-volume
          configMap:
            name: prometheus-rules
        - name: prometheus-storage-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
  type: NodePort
