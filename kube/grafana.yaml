            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Traffic",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests per second by endpoint",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
